title: agentrc
tagline: Agent Run Config
description: Open specification for declaring, packaging, securing, and sharing portable AI agents.
url: "https://agentrc.ai"
baseurl: ""
repository: adeelahmad/agentrc
author:
  name: Adeel Ahmad
  url: https://github.com/adeelahmad
  linkedin: https://www.linkedin.com/in/adeelahmadch
logo: /assets/brand/agentrc-icon-light.png
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
highlighter: rouge
permalink: pretty
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README_DEV.md
defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /assets/brand/agentrc-og.png
collections:
  spec_pages:
    output: true
nav:
  - title: What is agentrc?
    url: /docs/what-is-agentrc/
  - title: Spec
    url: /spec/
  - title: Docs
    url: /docs/
  - title: Examples
    url: /examples/
  - title: Profiles
    url: /profiles/
  - title: CLI
    url: /cli/
  - title: GitHub
    url: https://github.com/adeelahmad/agentrc
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
